services:

  # ── Database ──────────────────────────────
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pulse-network

  # ── Node API ──────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: always
    env_file: .env.production
    depends_on:
      - db
    networks:
      - pulse-network

  # ── Python AI Service ─────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
    restart: always
    env_file: .env.production
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - pulse-network

  # ── React Client (built as static files) ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    restart: always
    networks:
      - pulse-network

  # ── Nginx (reverse proxy + static files) ──
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/fullchain.pem:/etc/letsencrypt/live/pulsemd.live/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/letsencrypt/live/pulsemd.live/privkey.pem:ro
    depends_on:     
      - server
      - client
    networks:
      - pulse-network

networks:
  pulse-network:
    driver: bridge

volumes:
  db_data:
  chroma_data:
