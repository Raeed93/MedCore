events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  resolver 127.0.0.11 valid=30s;

  # ── Redirect HTTP to HTTPS ──
  server {
    listen 80;
    server_name pulsemd.live www.pulsemd.live;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS server ──
  server {
    listen 443 ssl;
    server_name pulsemd.live www.pulsemd.live;

    ssl_certificate /etc/letsencrypt/live/pulsemd.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsemd.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Auth routes ──
    location /auth/ {
      set $upstream_server server;
      proxy_pass http://$upstream_server:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }

    # ── Backend routes ──
    location ~ ^/(diagnose|patients|diagnosis-history|documents|health) {
      set $upstream_server server;
      proxy_pass http://$upstream_server:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }

    # ── React frontend ──
    location / {
      set $upstream_client client;
      proxy_pass http://$upstream_client:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
